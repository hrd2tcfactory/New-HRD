<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HRD Sopandi Tekno</title>
<meta name="robots" content="noindex,nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: workshop-console — fixed left rail of modules, wide data surface on the right; rail becomes a scrolling tab strip on phones */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#eef0f4; --line:#d9dde5; --fg:#16202e; --muted:#5d6879;
  --accent:#1f4fa3; --accent-ink:#ffffff; --accent-soft:#e3eafa;
  --ok:#1d7a46; --ok-soft:#dcf2e4; --warn:#a15c00; --warn-soft:#fdeccd; --bad:#b42318; --bad-soft:#fbe0dd;
  --c-H:#cfeedd; --c-I:#d6e4fb; --c-S:#e8dcf8; --c-C:#cdeef0; --c-A:#f9d6d2; --c-L:#e4e6ea; --c-LM:#fde7b8; --c-LTM:#fbd2b0; --c-SH:#e3f1c4;
  --t-H:#14532d; --t-I:#1e3a8a; --t-S:#5b2a91; --t-C:#0f5257; --t-A:#8a1c13; --t-L:#4b5563; --t-LM:#7a4500; --t-LTM:#8a3a00; --t-SH:#3f5a0a;
  --sun:#f6efe9;
  --g-harian:#0f766e; --g-harian-soft:#d5f1ee; --g-gaji:#a15c00; --g-gaji-soft:#fdeccd; --g-karyawan:#6d3fb5; --g-karyawan-soft:#ebe2fa; --g-lainnya:#5d6879; --g-lainnya-soft:#e6e9ee;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#161d27; --surface-2:#1d2633; --line:#2b3646; --fg:#e6ebf2; --muted:#98a3b3;
  --accent:#7da3ec; --accent-ink:#0b1220; --accent-soft:#1d2c48;
  --ok:#5fd08f; --ok-soft:#173826; --warn:#f0b35a; --warn-soft:#3a2a10; --bad:#f2877c; --bad-soft:#3d1a17;
  --c-H:#1b4730; --c-I:#1d3156; --c-S:#3a2a57; --c-C:#14454a; --c-A:#562420; --c-L:#2a313c; --c-LM:#4d3911; --c-LTM:#55301a; --c-SH:#34431a;
  --t-H:#bdf0d2; --t-I:#c9dafc; --t-S:#e0cffb; --t-C:#bdeef2; --t-A:#ffd0ca; --t-L:#c8ced8; --t-LM:#ffe1a6; --t-LTM:#ffcfae; --t-SH:#dcefb0;
  --g-harian:#5fd0c4; --g-harian-soft:#12403c; --g-gaji:#f0b35a; --g-gaji-soft:#3a2a10; --g-karyawan:#c0a2f5; --g-karyawan-soft:#33264f; --g-lainnya:#98a3b3; --g-lainnya-soft:#252f3d;
  --sun:#1f1d1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#161d27; --surface-2:#1d2633; --line:#2b3646; --fg:#e6ebf2; --muted:#98a3b3;
  --accent:#7da3ec; --accent-ink:#0b1220; --accent-soft:#1d2c48;
  --ok:#5fd08f; --ok-soft:#173826; --warn:#f0b35a; --warn-soft:#3a2a10; --bad:#f2877c; --bad-soft:#3d1a17;
  --c-H:#1b4730; --c-I:#1d3156; --c-S:#3a2a57; --c-C:#14454a; --c-A:#562420; --c-L:#2a313c; --c-LM:#4d3911; --c-LTM:#55301a; --c-SH:#34431a;
  --t-H:#bdf0d2; --t-I:#c9dafc; --t-S:#e0cffb; --t-C:#bdeef2; --t-A:#ffd0ca; --t-L:#c8ced8; --t-LM:#ffe1a6; --t-LTM:#ffcfae; --t-SH:#dcefb0;
  --sun:#1f1d1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.01em}
.brand span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 10px;border-radius:6px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:10px}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav .ico{width:18px;height:18px;flex:none}
.railfoot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
main{min-width:0;padding-block:20px 60px;padding-inline:24px;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.topbar h1{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0;text-wrap:balance}
.period{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px}
.period .lbl{padding:0 10px;display:flex;flex-direction:column;line-height:1.2;min-width:150px;text-align:center}
.period .lbl b{font-family:var(--f-display);font-size:15px}
.period .lbl small{color:var(--muted);font-size:11.5px;font-family:var(--f-mono)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.icon{padding:6px 8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:16px;margin:0 0 10px;font-weight:700}
.panel h2 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0;z-index:1}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-size:13px}
tbody tr:hover td{background:var(--surface-2)}
tfoot td{font-weight:600;background:var(--surface-2)}
.name{font-weight:600}
.sub{color:var(--muted);font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em}
.p-TETAP{background:var(--ok-soft);color:var(--ok)}
.p-KONTRAK{background:var(--accent-soft);color:var(--accent)}
.p-BELUM{background:var(--warn-soft);color:var(--warn)}
.p-TRAINING{background:var(--c-S);color:var(--t-S)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-mute{background:var(--surface-2);color:var(--muted)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
input.cellin{width:64px;padding:3px 6px;text-align:right;font-family:var(--f-mono);font-size:13px}
.search{width:220px;max-width:100%}
/* attendance grid */
.att{border-collapse:separate;border-spacing:0}
.att th,.att td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center}
.att th{padding:4px 0;font-family:var(--f-mono);font-size:11px;letter-spacing:0;text-transform:none}
.att th .dw{display:block;font-family:var(--f-body);font-size:9.5px;color:var(--muted)}
.att th.sun,.att td.sun{background:var(--sun)}
.att th.hol,.att td.hol{background:var(--bad-soft)}
.att th.today{box-shadow:inset 0 -3px 0 var(--accent);color:var(--accent)}
.att .stick{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:4px 10px;min-width:190px;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.att th.stick{z-index:3;background:var(--surface-2)}
.att .cell{width:30px;min-width:30px;height:28px;cursor:pointer;font-family:var(--f-mono);font-size:11px;font-weight:500;user-select:none}
.att th.fut{color:var(--muted)}
.att td.fut{opacity:.5;background-image:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px)}
.att .cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
.att .tot{font-family:var(--f-mono);font-size:12px;padding:0 6px;min-width:30px;background:var(--surface-2)}
.att td.lcell{padding:2px}
.att td.lcell input{width:40px;padding:2px 3px;text-align:center;font-family:var(--f-mono);font-size:12px;border-color:transparent;background:transparent}
.att td.lcell input:not(:placeholder-shown){background:var(--c-LM);color:var(--t-LM);font-weight:600}
.code-H{background:var(--c-H)!important;color:var(--t-H)} .code-I{background:var(--c-I)!important;color:var(--t-I)} .code-S{background:var(--c-S)!important;color:var(--t-S)}
.code-C{background:var(--c-C)!important;color:var(--t-C)} .code-A{background:var(--c-A)!important;color:var(--t-A)} .code-L{background:var(--c-L)!important;color:var(--t-L)}
.code-LM{background:var(--c-LM)!important;color:var(--t-LM)} .code-LTM{background:var(--c-LTM)!important;color:var(--t-LTM)} .code-SH{background:var(--c-SH)!important;color:var(--t-SH)}
.brushes{display:flex;flex-wrap:wrap;gap:6px}
.brush{all:unset;cursor:pointer;padding:5px 10px;border-radius:6px;font-size:12.5px;font-weight:600;border:2px solid transparent;display:inline-flex;gap:6px;align-items:center}
.brush b{font-family:var(--f-mono)}
.brush[aria-pressed="true"]{border-color:var(--fg)}
.brush:focus-visible{outline:2px solid var(--accent)}
.brush.erase{background:var(--surface-2);color:var(--muted)}
.legend{font-size:12px;color:var(--muted)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal:has(.mesinwrap){width:min(1100px,100%)}.mesinwrap{display:flex;flex-direction:column;gap:12px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.modal:has(.srtwrap){width:min(1200px,100%);max-height:94vh}
.srtwrap{display:flex;gap:18px;min-height:0}.srtL{flex:0 0 430px;display:flex;flex-direction:column;gap:12px;overflow:auto;max-height:86vh;padding-right:4px}.srtR{flex:1;min-width:0;background:var(--line);border-radius:8px;overflow:hidden}.srtR iframe{width:100%;height:86vh;border:0;background:#fff}
.srtTabs{display:flex;flex-wrap:wrap;gap:6px}.srtTabs .btn{font-size:12.5px;padding:6px 10px}.srtTabs .btn.on{border-color:var(--accent);color:var(--accent);font-weight:600}
@media (max-width:900px){.srtwrap{flex-direction:column}.srtL{flex:none;max-height:none}.srtR iframe{height:70vh}}
.modal h3{font-family:var(--f-display);margin:0;font-size:18px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.form label.full{grid-column:1/-1}
.form .hint{font-size:11.5px;color:var(--muted);font-weight:400}
/* slip */
.slip{background:var(--surface);border:1px solid var(--line);border-radius:10px;max-width:720px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.slip .hd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--fg);padding-bottom:10px}
.slip .hd b{font-family:var(--f-display);font-size:18px}
.slip .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.slip .meta div span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.slipatt{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.slipatt-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--surface-2);padding:7px 12px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.slipatt-h span:last-child{text-transform:none;letter-spacing:0;font-family:var(--f-mono);font-weight:400}
.slipatt-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.slipatt-c{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-top:1px solid var(--line);border-right:1px solid var(--line)}
.slipatt-c:nth-child(4n){border-right:none}
.slipatt-c.hl{background:var(--c-SH)}
.slipatt-k{align-self:flex-start;font-family:var(--f-mono);font-size:10.5px;font-weight:600;padding:0 5px;border-radius:4px}
.slipatt-n{font-size:12px;color:var(--muted)}
.slipatt-c b{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}
.slipatt-c b small{font-family:var(--f-body);font-size:11px;font-weight:400;color:var(--muted)}
.slipcuti-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.slipcuti-g .slipatt-c:nth-child(3){border-right:none}
.slipatt-f{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line);font-size:13px}
@media (max-width:520px){.slipatt-g{grid-template-columns:repeat(2,minmax(0,1fr))}.slipatt-c:nth-child(4n){border-right:1px solid var(--line)}.slipatt-c:nth-child(2n){border-right:none}}
.slip .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.slip .ln{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line);gap:10px}
.slip .ln span:last-child{font-family:var(--f-mono)}
.slip .ln.tot{border-bottom:none;font-weight:700}
.slip .thp{display:flex;justify-content:space-between;align-items:center;background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:12px 14px;gap:10px;flex-wrap:wrap}
.slip .thp b{font-family:var(--f-display);font-size:24px;color:var(--accent)}
.slip .cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-size:13px}.slip .cols3 span{display:block;font-size:11px;color:var(--muted)}.slip .ttd{height:34px;display:flex;align-items:flex-end}.slip .ttd img{max-height:34px;max-width:100%;background:#fff;border-radius:3px}
.slip .terb{font-style:italic;color:var(--muted);font-size:12.5px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:none}
.li .t{flex:1;min-width:0}
.li .t div{overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;align-items:flex-end;gap:2px;height:120px;padding-top:6px}
.bars .b{flex:1;background:var(--accent);opacity:.85;border-radius:2px 2px 0 0;min-width:3px;position:relative}
.bars .b.sun{background:var(--line)}
.bars .b.today{opacity:1;outline:2px solid var(--fg)}
.axis{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:60;max-width:calc(100% - 32px)}
.saving{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.note{font-size:12.5px;color:var(--muted);max-width:75ch}
.lockbar{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn);border-radius:10px;padding:12px 14px}
.lockbar svg{color:var(--warn);flex:none;margin-top:2px}
.lockbar b{display:block}.lockbar span{font-size:12.5px;color:var(--muted)}
.wa{color:var(--accent);text-decoration:none;font-family:var(--f-mono);font-size:12.5px}
.wa:hover{text-decoration:underline}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:8px 12px;gap:10px;overflow-x:auto;z-index:10;border-right:none;border-bottom:1px solid var(--line)}
  .brand span,.railfoot{display:none}
  .nav{flex-direction:row}
  .nav button{padding:7px 10px;white-space:nowrap}
  main{padding-inline:16px}
  .grid2{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .slip .cols{grid-template-columns:1fr}
  .att .stick{min-width:130px;max-width:130px}
}
@media (prefers-reduced-motion:no-preference){.btn,.nav button{transition:background .12s}}

.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:80}
.lgcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);width:min(800px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 18px 40px -24px rgba(10,15,25,.5)}
.lgside{background:var(--accent);color:var(--accent-ink);padding:32px;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.lgside h2{font-family:var(--f-display);font-weight:800;font-size:28px;margin:0;line-height:1.1}.lgside p{margin:6px 0 0;opacity:.9}.lgside .lgfoot{font-size:12.5px;opacity:.8;margin:0}
.lglogo{background:#fff;border-radius:10px;padding:6px;align-self:flex-start;display:flex}.lglogo img{height:54px;width:auto;max-width:none;display:block}.lglogo img:not([src]){display:none}
.login form{padding:32px;display:flex;flex-direction:column;gap:12px;justify-content:center}
@media (max-width:700px){.lgcard{grid-template-columns:1fr}.lgside{padding:20px;gap:14px}.lgside h2{font-size:22px}.lgside .lgfoot{display:none}.login form{padding:20px}}
.login h1{font-family:var(--f-display);font-size:22px;margin:0}
.login label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.login .err{color:var(--bad);font-size:13px;min-height:1em}

<body>
<div class="login" id="loginRoot" hidden>
  <div class="lgcard"><div class="lgside"><span class="lglogo"><img id="lgLogo" alt="Logo perusahaan"></span><div><h2>Sistem HRD</h2><p>CV. Sopandi Tekno Utama</p></div><p class="lgfoot">Absensi, lembur, payroll, dan surat karyawan. Hanya untuk petugas HRD yang terdaftar.</p></div>
  <form id="loginForm" novalidate>
    <h1>Masuk</h1>
    <p class="note" style="margin:0">Masuk dengan akun HRD yang sudah didaftarkan.</p>
    <label for="lgEmail">Email<input id="lgEmail" type="email" autocomplete="username" required></label>
    <label for="lgPass">Kata sandi<input id="lgPass" type="password" autocomplete="current-password" required></label>
    <div class="err" id="lgErr" role="alert"></div>
    <button class="btn primary" type="submit" id="lgBtn">Masuk</button>
    <button class="btn ghost" type="button" id="lgReset">Lupa kata sandi</button>
  </form></div>
</div>
<script>
window.HRD_SHOW_LOGIN=function(api){
  var root=document.getElementById('loginRoot');root.hidden=false;
  var f=document.getElementById('loginForm'),err=document.getElementById('lgErr'),btn=document.getElementById('lgBtn');
  var msg=function(c){return ({'auth/invalid-credential':'Email atau kata sandi salah.','auth/invalid-email':'Format email tidak valid.','auth/too-many-requests':'Terlalu banyak percobaan. Tunggu beberapa menit.','auth/network-request-failed':'Tidak ada koneksi internet.'})[c]||'Gagal masuk ('+c+').'};
  f.onsubmit=function(e){e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='Memeriksa…';
    api.login(document.getElementById('lgEmail').value.trim(),document.getElementById('lgPass').value).then(function(){root.hidden=true}).catch(function(x){err.textContent=msg(x.code)}).finally(function(){btn.disabled=false;btn.textContent='Masuk'})};
  document.getElementById('lgReset').onclick=function(){var em=document.getElementById('lgEmail').value.trim();if(!em){err.textContent='Isi email dulu, lalu tekan Lupa kata sandi.';return}
    api.reset(em).then(function(){err.textContent='Link ganti kata sandi sudah dikirim ke '+em+'.'}).catch(function(x){err.textContent=msg(x.code)})};
};
</script>

};
const TABS=[
  ['dash','Dasbor','dash',''],
  ['att','Absensi','att','Harian'],['ot','Lembur','ot','Harian'],['telat','Telat','telat','Harian'],

  ['emp','Karyawan','emp','Karyawan'],['leave','Cuti','leave','Karyawan'],['ctr','Kontrak & PKL','ctr','Karyawan'],['sp','Surat Peringatan','sp','Karyawan'],['kpi','KPI','kpi','Karyawan'],['note','Catatan','note','Karyawan'],

const S={db:null,dl:null,settings:null,emps:{},surat:{},loans:{},warns:{},interns:{},notes:{},kpiD:{},kpiN:{},kDiv:'',kpiMonth:null,kpiEmp:null,nCat:'',nSt:'aktif',periods:{},ready:{},tab:'dash',periodKey:null,brush:'H',q:'',status:'',slipEmp:null,dirty:false,saving:0,readonly:false,armed:null};
S.empView='aktif';S.logs={};S.attMode=lsGet('hrd.att')||'hari';S.lq='';S.lk='';S.lw='';S.empSel=null;

// ---------- utils ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>new Intl.NumberFormat('id-ID').format(Math.round(n||0));

function deepMerge(t,s){for(const k in s){const v=s[k];if(v&&typeof v==='object'&&!Array.isArray(v)){if(!t[k]||typeof t[k]!=='object')t[k]={};deepMerge(t[k],v)}else t[k]=v}return t}
function toast(msg){const r=$('#toastRoot');r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',3200)}

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}

// ---------- period ----------
function cutoff(){return (S.settings&&+S.settings.cutoff)||21}
function keyFor(date){const c=cutoff();let y=date.getFullYear(),m=date.getMonth()+1;if(date.getDate()>=c){m++;if(m>12){m=1;y++}}return y+'-'+pad(m)}
function periodRange(key){const [y,m]=key.split('-').map(Number);const c=cutoff();const start=new Date(y,m-2,c);const end=new Date(y,m-1,c-1);return {start,end}}
function periodDates(key){const {start,end}=periodRange(key);const out=[];for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1))out.push(iso(d));return out}
function shiftKey(key,n){let [y,m]=key.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+pad(m)}

// ---------- employees ----------
const DEFAULT_ORDER=['PENASEHAT','GENERAL MANAGER','MANAGER','MANAGER CNC','KABAG PRODUKSI','HRD','FINANCE','CAM PRODUKSI','PROGRAMMER','PPIC','DESIGN','SUPERVISIOR CNC','WAKIL SUPERVISIOR','OPERATOR CNC','OPERATOR CUTTING','WELDING','ASSEMBLY','LASER MARKING','ADMIN','CONTENT CREATOR','GUDANG','PACKER','DRIVER','OB'];
function jabOrder(){const o=S.settings&&S.settings.jabatanOrder;return (o&&o.length)?o:DEFAULT_ORDER}
// Samakan ejaan sebelum dibandingkan (SUPERVISIOR = SUPERVISOR, DEVISI = DIVISI, spasi ganda, OB = OFFICE BOY, dst.)
function normJab(j){return String(j||'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/SUPERVISIOR/g,'SUPERVISOR').replace(/\bSPV\b/g,'SUPERVISOR').replace(/\bDEVISI\b/g,'DIVISI').replace(/\bKEPALA BAGIAN\b/g,'KABAG').replace(/\bOFFICE BOY\b/g,'OB').replace(/\s+/g,' ').trim()}
function jabRank(j){const o=jabOrder().map(normJab),n=normJab(j);if(!n)return 999;let i=o.indexOf(n);if(i>=0)return i;
  i=o.findIndex(x=>x&&(x.startsWith(n+' ')||n.startsWith(x+' ')));if(i>=0)return i;
  i=o.findIndex(x=>x&&(x.includes(n)||n.includes(x)));return i<0?999:i}
function byRank(a,b){return jabRank(a.jabatan)-jabRank(b.jabatan)||(a.jabatan||'').localeCompare(b.jabatan||'')||a.id.localeCompare(b.id)}

function periodEmps(key){key=key||S.periodKey;const per=S.periods[key]||{};const has=id=>{const a=(per.absensi||{})[id]||{},l=(per.lembur||{})[id]||{};return Object.values(a).some(v=>v)||Object.values(l).some(v=>+v)};

function counts(empId,key){const a=((S.periods[key]||{}).absensi||{})[empId]||{};const c={H:0,SH:0,I:0,S:0,C:0,A:0,L:0,LM:0,LTM:0};const {start,end}=periodRange(key);const f=iso(start),t=iso(end);for(const d in a){if(d<f||d>t)continue;const v=a[d];if(c[v]!=null)c[v]++}return c}

function attChecks(key){
  key=key||S.periodKey;const per=S.periods[key]||{};const A=per.absensi||{},Lm=per.lembur||{};const t=todayISO();const hol=holidays();const out=[];

function payChecks(key){

  periodEmps(key).forEach(e=>{const r=liveCalc(e,key);const gp=+e.gajiPokok||0;const add=(lvl,s)=>out.push({lvl,id:e.id,t:e.nama,s});

function otHours(empId,key){const l=((S.periods[key]||{}).lembur||{})[empId]||{};let t=0;for(const d in l)t+=(+l[d]||0);return t}
function loanPaidBefore(loan,key){let t=0;const p=loan.potongan||{};for(const k in p)if(k!==key)t+=(+p[k]||0);return t}
function loanDeduction(loan,key){
  const p=loan.potongan||{};if(p[key]!=null)return +p[key]||0;
  const {end}=periodRange(key);if(loan.tanggal&&parse(loan.tanggal)>end)return 0;
  const later=Object.keys(p).some(k=>k>key&&p[k]!=null);if(later)return 0;
  const rem=(+loan.jumlah||0)-loanPaidBefore(loan,key);return Math.max(0,Math.min(+loan.cicilan||0,rem))}
function kasbonFor(empId,key){let t=0;for(const id in S.loans){const l=S.loans[id];if(l.empId===empId)t+=loanDeduction(l,key)}return t}
function lockOf(key){const k=(S.periods[key||S.periodKey]||{}).kunci;return k&&k.rows?k:null}
function isLocked(key){return !!lockOf(key)}
function liveCalc(e,key){
  key=key||S.periodKey;const per=S.periods[key]||{};
  const c=counts(e.id,key);const harian=(+e.gajiPokok||0)/((+e.pembagi)||24);
  const gajiHadir=harian*(c.H+c.SH+c.C);
  const shRate=shRateFor(harian);const potSH=e.status==='TETAP'?0:c.SH*shRate;
  const lm=Math.round(harian*c.LM)*2;
  const ltm=Math.round(harian*c.LTM)*((+e.kaliLTM)||1);
  const jam=otHours(e.id,key);const rateJam=otRate(e);const lj=Math.round(jam*rateJam);const hariUM=mealDays(e.id,key);const um=hariUM*mealCfg().amt;
  let base=e.metode==='HARIAN'?gajiHadir:(+e.gajiPokok||0);
  // karyawan bulanan yang masuk atau keluar di tengah periode: prorata menurut hari kerja (lihat proRange)
  let pro=null;if(e.metode!=='HARIAN'){pro=proRange(e,key);if(pro)base=Math.round((+e.gajiPokok||0)*pro.dj/pro.wd)}
  const cut=e.metode==='HARIAN'?[]:((S.settings&&S.settings.potongBulanan)||[]);
  const hariPotong=cut.reduce((n,k)=>n+(c[k]||0),0);const potAbsen=Math.round(harian*hariPotong);
  const reimb=+((per.reimburse||{})[e.id])||0;const bonus=+((per.bonus||{})[e.id])||0;const pot=+((per.potonganLain||{})[e.id])||0;
  const kas=kasbonFor(e.id,key);
  const tH=telatHitung(e.id,key);const telatJam=tH.jam,telatHari=tH.hari;const telatTarif=telatCfg().tarif;const potTelat=telatBebas(e)?0:telatJam*telatTarif;
  const terima=base+lm+ltm+lj+um+reimb+bonus;
  return {c,harian,gajiHadir,lm,ltm,jam,lj,um,hariUM,base,pro,reimb,bonus,pot,kas,potAbsen,hariPotong,cutKode:cut.slice(),potSH,shRate,rateJam,telatJam,telatHari,telatTarif,potTelat,terima,potongan:kas+pot+potAbsen+potSH+potTelat,thp:Math.round(terima-kas-pot-potAbsen-potSH-potTelat)}
}
// Hari kerja yang dibayar untuk karyawan bulanan di satu periode: dari tanggal bergabung (bila di dalam periode)

function proRange(e,key,keluar){const {start,end}=periodRange(key);const s0=iso(start),s1=iso(end);const out=keluar!=null?keluar:e.tglKeluar;const join=e.tglBergabung||'';
  const from=join>s0?join:s0;const to=out&&out<s1?out:s1;if(from===s0&&to===s1)return null;const wd=workDays(s0,s1);if(!wd)return null;
  return {dj:to<from?0:workDays(from,to),wd,from,to}}
function workDays(a,b){const hol=holidays();let n=0;for(let d=parse(a);iso(d)<=b;d.setDate(d.getDate()+1)){if(d.getDay()!==0&&!hol.has(iso(d)))n++}return n}
function mealCfg(){const st=S.settings||{};return {amt:st.uangMakan!=null?+st.uangMakan:20000,min:st.makanMinJam!=null?+st.makanMinJam:4}}
function mealDays(empId,key){const l=((S.periods[key]||{}).lembur||{})[empId]||{};const m=mealCfg();let n=0;for(const d in l)if(+l[d]>=m.min)n++;return n}
function otRate(e){const umum=(S.settings&&+S.settings.uangLembur)||0;if(e.lemburMode==='harian8')return ((+e.gajiPokok||0)/((+e.pembagi)||24))/8*((+e.lemburKali)||1);if(e.lemburMode==='khusus')return +e.lemburTarif||0;return umum}
function otRateLabel(e){return e.lemburMode==='harian8'?'gaji/hari ÷ 8'+((+e.lemburKali||1)!==1?' × '+e.lemburKali:'')+' = Rp '+rp(otRate(e)):e.lemburMode==='khusus'?'khusus Rp '+rp(otRate(e)):'umum Rp '+rp(otRate(e))}
function shRateFor(harian){const st=S.settings||{};const batas=st.shBatas!=null?+st.shBatas:100000;const hi=st.shPotong!=null?+st.shPotong:50000;const lo=st.shPotongRendah!=null?+st.shPotongRendah:30000;return harian<batas?lo:hi}

// ---- cuti year (resets each year on the 1st of settings.cutiMulaiBulan) ----
function cutiStartMonth(){return (S.settings&&+S.settings.cutiMulaiBulan)||4}
function cutiYearOf(d){const dt=typeof d==='string'?parse(d):d;return dt.getMonth()+1>=cutiStartMonth()?dt.getFullYear():dt.getFullYear()-1}
function cutiRange(y){const m=cutiStartMonth();return {from:y+'-'+pad(m)+'-01',to:iso(new Date(y+1,m-1,0))}}

function kuotaFor(e,y){const o=(e.kuotaTahun||{})[y];if(o!=null&&o!=='')return +o;return y===cutiAwalYear()?(+e.kuotaCuti||0):((S.settings&&+S.settings.kuotaCutiDefault)||12)}

function cutiUsed(e,y){if(y==null)y=cutiYearOf(new Date());const {from,to}=cutiRange(y);const rs=e.cutiReset||'';let n=0;for(const k in S.periods){const a=(S.periods[k].absensi||{})[e.id]||{};for(const d in a)if(a[d]==='C'&&d>=from&&d<=to&&d>=rs)n++}return n}

function queuePatch(path,patch,createBody){
  if(!S.db){toast('Database belum tersambung.');return}
  const q=Q[path]||(Q[path]={patch:{},timer:null,running:false,create:null});
  deepMerge(q.patch,patch);if(createBody)q.create=createBody;
  clearTimeout(q.timer);q.timer=setTimeout(()=>flush(path),400);
}
async function flush(path){
  const q=Q[path];if(!q||q.running)return;const patch=q.patch;q.patch={};if(!Object.keys(patch).length)return;
  q.running=true;setSaving(1);
  try{const ref=S.db.doc(path);
    if(q.create){const snap=await ref.get();if(!snap.exists){await ref.set(deepMerge(clone(q.create),patch))}else await ref.update(patch);q.create=null}
    else await ref.update(patch)}
  catch(e){handleErr(e)}
  q.running=false;setSaving(-1);if(Object.keys(q.patch).length)flush(path)}

function vDash(){

  const byS={};emps.forEach(e=>byS[e.status]=(byS[e.status]||0)+1);
  let total=0;payEmps(key).forEach(e=>total+=calc(e,key).thp);
  const per=S.periods[keyFor(new Date())]||{};const att=per.absensi||{};
  const tc={H:0,I:0,S:0,C:0,A:0,kosong:0};emps.forEach(e=>{const v=(att[e.id]||{})[t];if(v==='H'||v==='SH'||v==='LM'||v==='LTM')tc.H++;else if(tc[v]!=null)tc[v]++;else tc.kosong++});

// Impor laporan lembur (teks bebas: "Jumat 25 sep = 2 jam") ke satu karyawan
function parseLembur(txt,key){
  const MAP={jan:1,feb:2,mar:3,apr:4,mei:5,jun:6,jul:7,agu:8,ags:8,sep:9,okt:10,ok:10,nov:11,des:12};
  const dates=periodDates(key),out={},bad=[];
  txt.split(/\n/).forEach(raw=>{const ln=raw.trim();if(!ln||!/\d/.test(ln))return;

function parseRek(txt,fallback){
  const t=String(txt||'').trim();const m=t.match(/^[\d\s.-]+/);const acc=(m?m[0]:'').replace(/\D/g,'');
  let nm=(t.match(/\(([^)]*)\)/)||[])[1]||'';
  if(!nm){nm=t.slice(m?m[0].length:0).replace(/^\s*(an\/|a\/n|a\.\s*n\.?|an\.?)\s*/i,'').trim()}
  nm=nm.replace(/\s+/g,' ').trim();if(!nm)nm=fallback||'';
  nm=nm.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
  return {acc,name:nm.slice(0,70)};
}
function bcaRows(){
  const out=[],bad=[];
  payEmps().forEach(e=>{const r=calc(e);const amt=Math.round(r.thp||0);const live=S.emps[e.id]||e;
    const rk=parseRek(live.rekening||e.rekening,e.nama);
    if(amt<=0){bad.push({e,why:'THP Rp 0 atau minus, tidak ditransfer'});return}
    if(!rk.acc){bad.push({e,why:'Nomor rekening belum diisi'});return}
    if(rk.acc.length!==10){bad.push({e,why:'Nomor rekening '+rk.acc+' bukan 10 digit (rekening BCA selalu 10 digit; '+(rk.acc.length===16?'ini mungkin nomor kartu ATM':'periksa lagi')+')'});return}
    out.push({e,acc:rk.acc,name:rk.name,amt});
  });
  return {out,bad};
}

  const aoa=[['ID','Nama','Jabatan'].concat(dates.map(d=>parse(d).getDate())).concat(['H','SH','I','S','C','A','LM','LTM'])];
  payEmps().forEach(e=>{const c=counts(e.id,S.periodKey);aoa.push([e.id,e.nama,e.jabatan].concat(dates.map(d=>(A[e.id]||{})[d]||'')).concat([c.H,c.SH||0,c.I,c.S,c.C,c.A,c.LM,c.LTM]))});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),'ABSENSI');
  const L=P().lembur||{};const ol=[['ID','Nama'].concat(dates.map(d=>parse(d).getDate())).concat(['Total Jam'])];
  payEmps().forEach(e=>{const r=L[e.id]||{};ol.push([e.id,e.nama].concat(dates.map(d=>+r[d]||'')).concat([otHours(e.id,S.periodKey)]))});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ol),'LEMBUR');
  const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});

}
function postLoans(key){
  for(const id in S.loans){const l=S.loans[id];const amt=loanDeduction(Object.assign({},l,{potongan:Object.assign({},l.potongan,{[key]:undefined})}),key);
    const cur=(l.potongan||{})[key];if(amt>0||cur!=null){l.potongan=Object.assign({},l.potongan,{[key]:amt});queuePatch('loans/'+id,{potongan:{[key]:amt}})}}
}
function unpostLoans(key){
  for(const id in S.loans){const l=S.loans[id];if((l.potongan||{})[key]==null)continue;
    delete l.potongan[key];queuePatch('loans/'+id,{potongan:{[key]:null}})}
}
function restoreLoans(key){
  let n=0;
  for(const id in S.loans){const l=S.loans[id];const p=l.potongan||{};if(p[key]!=null)continue;
    const later=Object.keys(p).filter(k=>k>key&&p[k]!=null).sort()[0];if(!later)continue;
    const amt=p[later];l.potongan[key]=amt;delete l.potongan[later];queuePatch('loans/'+id,{potongan:{[key]:amt,[later]:null}});n++}
  return n}
function lockPay(){
  const key=S.periodKey;if(isLocked(key))return;
  postLoans(key);
  const rows={};
  periodEmps(key).forEach(e=>{const r=liveCalc(e,key);
    rows[e.id]={e:{id:e.id,nama:e.nama,jabatan:e.jabatan,status:e.status,gajiPokok:+e.gajiPokok||0,metode:e.metode,pembagi:+e.pembagi||24,kaliLTM:+e.kaliLTM||1,rekening:e.rekening||'',wa:e.wa||''},r:JSON.parse(JSON.stringify(r))}});
  patchPeriod({kunci:{at:new Date().toISOString(),rows}});
  logAct('gaji','Mengunci payroll '+periodLabel(key),{ket:Object.keys(rows).length+' karyawan · total THP Rp '+rp(Object.values(rows).reduce((a,x)=>a+(+x.r.thp||0),0))});
  toast('Payroll '+periodLabel(key)+' dikunci. Potongan kasbon sudah dicatat.');render(true);
}
function unlockPay(){
  const key=S.periodKey;if(!isLocked(key))return;
  unpostLoans(key);
  patchPeriod({kunci:null});
  logAct('gaji','Membuka kunci payroll '+periodLabel(key));
  toast('Kunci dibuka. Potongan kasbon periode ini dibatalkan. Kunci lagi setelah koreksi selesai.');render(true);
}

function terbilang(n){n=Math.floor(Math.abs(n));const s=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];

  const t=(f(n)||'nol').replace(/\s+/g,' ').trim()+' rupiah';return t.charAt(0).toUpperCase()+t.slice(1)}

async function slipPdf(ids){

  const doc=new jspdf.jsPDF({unit:'mm',format:'a5'});
  ids.forEach((id,i)=>{if(i)doc.addPage();drawSlip(doc,payEmp(id,S.periodKey))});
  const name=ids.length===1?'Slip Gaji '+payEmp(ids[0],S.periodKey).nama+' '+periodLabel(S.periodKey)+'.pdf':'Slip Gaji Semua '+periodLabel(S.periodKey)+'.pdf';
  try{await S.dl.save({filename:name,data:new Blob([doc.output('arraybuffer')])});toast('PDF diunduh.');return name}catch(e){if(e&&e.code!=='declined')toast('Unduhan gagal ('+(e&&e.code||'error')+').');return null}
}
function slipBlobB64(id){
  const doc=new jspdf.jsPDF({unit:'mm',format:'a5'});drawSlip(doc,payEmp(id,S.periodKey));
  const u8=new Uint8Array(doc.output('arraybuffer'));let bin='';for(let i=0;i<u8.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(bin)}
async function mailOne(id,token,revisi){
  const e=payEmp(id,S.periodKey);const to=((S.emps[id]||{}).email||'').trim();
  if(!to)return {ok:false,err:'email belum diisi'};
  try{
    const r=await fetch('/api/kirim-slip',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({to,nama:e.nama,periode:periodLabel(S.periodKey),rentang:periodSub(S.periodKey),perusahaan:(S.settings||{}).nama,filename:'Slip Gaji '+e.nama+' '+periodLabel(S.periodKey)+'.pdf',pdfBase64:slipBlobB64(id),revisi:!!revisi})});
    const j=await r.json().catch(()=>({}));return r.ok?{ok:true}:{ok:false,err:j.error||('HTTP '+r.status)}
  }catch(err){return {ok:false,err:'koneksi gagal'}}
}
async function mailSlips(ids,revisi){
  if(!window.jspdf){toast('Pustaka PDF belum termuat. Coba lagi sebentar.');return}
  if(!S.getToken){toast('Kirim email tidak tersedia di tampilan ini.');return}
  const sent=S.mailSent||(S.mailSent={});const key=S.periodKey;const res=[];
  const token=await S.getToken();
  for(let i=0;i<ids.length;i++){
    toast('Mengirim '+(i+1)+' dari '+ids.length+'…');
    const e=payEmp(ids[i],key);const r=await mailOne(ids[i],token,revisi);
    if(r.ok)sent[key+'|'+ids[i]]=1;res.push(Object.assign({id:ids[i],nama:e.nama},r));
    await new Promise(z=>setTimeout(z,600));
  }
  const ok=res.filter(x=>x.ok),bad=res.filter(x=>!x.ok);
  if(ok.length)logAct('akses','Mengirim slip gaji via email',{ket:ok.length+' terkirim, '+bad.length+' gagal · '+periodLabel(key)});
  if(ok.length&&S.periodKey===key){const sk={};const at=new Date().toISOString();ok.forEach(x=>sk[x.id]=at);patchPeriod({slipKirim:sk})}
  if(ids.length===1){toast(ok.length?'Slip terkirim ke '+((S.emps[ids[0]]||{}).email)+'.':'Gagal: '+bad[0].err);return}
  openModal('<h3>Hasil kirim email · '+periodLabel(key)+'</h3><p class="note" style="margin:0"><b>'+ok.length+'</b> terkirim, <b>'+bad.length+'</b> gagal.</p>'+
   (bad.length?'<div class="tablewrap"><table><thead><tr><th>Karyawan</th><th>Alasan</th></tr></thead><tbody>'+bad.map(x=>'<tr><td>'+esc(x.id+' '+x.nama)+'</td><td class="sub">'+esc(x.err)+'</td></tr>').join('')+'</tbody></table></div>':'')+
   '<div class="row"><button class="btn" data-act="closeModal">Tutup</button></div>');
}
function mailAll(revisi){
  const ids=payEmps().map(e=>e.id);const noMail=ids.filter(id=>!((S.emps[id]||{}).email));
  const sent=S.mailSent||{};const done=ids.filter(id=>sent[S.periodKey+'|'+id]).length;
  openModal('<h3>'+(revisi?'Kirim ulang semua slip sebagai REVISI':'Kirim semua slip via email')+'</h3><p class="note" style="margin:0">Periode <b>'+periodLabel(S.periodKey)+'</b>: <b>'+(ids.length-noMail.length)+'</b> karyawan punya email dan akan dikirimi slip PDF.'+(noMail.length?' <b>'+noMail.length+'</b> belum punya email dan dilewati.':'')+(done?' <b>'+done+'</b> sudah terkirim di sesi ini dan akan dikirim ulang.':'')+(isLocked()?'':' Payroll periode ini <b>belum dikunci</b>: angka bisa masih berubah.')+'</p><div class="row"><button class="btn primary" data-act="'+(revisi?'mailAllRevGo':'mailAllGo')+'">Kirim sekarang</button><button class="btn" data-act="closeModal">Batal</button></div>');
}

const tCase=s=>String(s||'').toLowerCase().replace(/(^|[\s(\/.-])([a-z])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(Cnc|Hrd|Ppic|Cam|Ob|R&d|Ktp|Cv|Pt|Gm|Spv)\b/g,w=>w.toUpperCase());
const longD=s=>{const d=parse(s);return d?d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear():'....................'};
const cl=v=>String(v==null?'':v).replace(/\*/g,'').trim();
const B=v=>'**'+cl(v)+'**';
function bulanTxt(n){n=+n||0;const t=terbilang(n).replace(/ rupiah$/,'').toLowerCase();return n+' ('+t+') bulan'}
function rpTxt(n){return 'Rp'+rp(n)+',00 ('+terbilang(n).replace(/\b\w/g,c=>c.toUpperCase())+')'}
function deptOf(j){j=normJab(j||'');if(/FINANCE/.test(j))return 'Finance';if(/ADMIN|HRD|CONTENT/.test(j))return 'Office';if(/DESIGN/.test(j))return 'Design / R&D';if(/MANAGER|PENASEHAT/.test(j))return 'Manajemen';if(/DRIVER|OB/.test(j))return 'Umum';return 'Produksi'}
const TUGAS={FINANCE:['Mencatat dan merekap transaksi keuangan harian.','Menyiapkan data pembayaran gaji, kasbon, dan pembayaran pemasok.','Menyusun laporan keuangan bulanan untuk pimpinan.'],
  'OPERATOR CNC':['Mengoperasikan mesin CNC sesuai gambar kerja dan program.','Memeriksa ukuran hasil produksi dengan alat ukur.','Merawat dan membersihkan mesin serta area kerja.'],
  ADMIN:['Mengelola administrasi dan dokumen perusahaan.','Merekap data penjualan dan pesanan.','Membantu kebutuhan administrasi bagian lain.']};
function suratSeq(j,tgl){const d=parse(tgl)||new Date();return (((S.settings||{}).suratNo||{})[j+d.getFullYear()]||0)+1}
function suratNo(j,tgl){const d=parse(tgl)||new Date();const y=d.getFullYear(),n=String(suratSeq(j,tgl)).padStart(3,'0'),r=ROMAN[d.getMonth()];
  return j==='pkwt'?'PKWT/'+n+'/CV-STU/'+r+'/'+y:SURAT[j].kode+'/'+n+'/HRD/'+r+'/'+y}
// Alasan pemberhentian kerja: label, petunjuk isian rincian, alasan keluar yang dicatat, dan apakah ditutup ucapan terima kasih
const PHK_ALASAN={
  kompeten:{n:'Tidak kompeten / kinerja di bawah standar',hint:'Contoh: target produksi tidak tercapai 3 bulan berturut-turut dan hasil kerja sering cacat',keluar:'PHK',tk:true},
  sp:{n:'Mengulangi pelanggaran saat SP masih berlaku',hint:'Pelanggaran terakhir, contoh: terlambat 6 kali dalam bulan Oktober',keluar:'PHK',tk:false},
  berat:{n:'Pelanggaran berat',hint:'Contoh: mengambil barang milik perusahaan tanpa izin pada 3 November 2026',keluar:'PHK',tk:false},
  mangkir:{n:'Mangkir 5 hari kerja berturut-turut',hint:'Opsional: keterangan tambahan',keluar:'PHK',tk:false},
  efisiensi:{n:'Efisiensi / pengurangan karyawan',hint:'Opsional: kondisi perusahaan, contoh: penurunan pesanan sejak Agustus 2026',keluar:'PHK',tk:true},
  kontrak:{n:'Kontrak (PKWT) tidak diperpanjang',hint:'Opsional: alasan tidak diperpanjang',keluar:'Kontrak berakhir',tk:true},
  lain:{n:'Alasan lain',hint:'Tulis alasan pemberhentian dengan lengkap',keluar:'PHK',tk:false}};
function spRiwayat(empId){return Object.values(S.warns).filter(w=>w.empId===empId).sort((a,b)=>String(a.tanggal).localeCompare(String(b.tanggal))).map(w=>w.tingkat+(w.nomor?' Nomor '+w.nomor:'')+' tanggal '+longD(w.tanggal)).join('; ')}
function srtDefaults(j,e){
  const st=S.settings||{};const t=todayISO();const dir=tCase(st.menyetujui||'Eep Sopandi'),hrd=tCase(st.pembuat||'Putri Ayu Salamah');
  const f={tanggal:t,nomor:suratNo(j,t),ttdNama:j==='pkwt'?dir:hrd,ttdJab:j==='pkwt'?'Direktur':'HRD'};
  if(e){Object.assign(f,{nama:tCase(e.namaKtp||e.nama),jabatan:tCase(e.jabatan),dept:deptOf(e.jabatan),nik:e.nik||'',alamat:e.alamat||'',telp:e.wa?('0'+String(e.wa).replace(/^62/,'')):'',
    tempatLahir:e.tempatLahir||'',tglLahir:e.tglLahir||'',pendidikan:e.pendidikan||'',jk:e.jk||'',agama:e.agama||'',gaji:Math.round(+e.gajiPokok||0),status:e.status||'',masuk:e.tglBergabung||''})}
  if(j==='pkwt'){f.mulai=(e&&e.kontrakMulai)||t;f.lama=12;f.selesai=addMonthsISO(f.mulai,12);f.lembur=+st.uangLembur||20000;f.tglGaji=25;
    f.tugas=(TUGAS[normJab((e||{}).jabatan||'')]||['','','']).join('\n');f.simpanKontrak=true}
  if(j==='sp'){f.tingkat='SP 1';f.pelanggaran='';f.lama=6;f.sampai=addMonthsISO(t,6);f.catat=true}
  if(j==='skors'){f.pelanggaran='';f.mulai=t;f.selesai=t}
  if(j==='skk')f.keperluan='';
  if(j==='phk'){const dir=tCase(st.menyetujui||'Eep Sopandi');Object.assign(f,{ttdNama:dir,ttdJab:'Direktur',alasanPhk:'kompeten',akhir:t,rincian:'',riwayatSp:e?spRiwayat(e.id):'',mDari:'',mSampai:'',pgl1:'',pgl2:'',noKontrak:'',
    kontrakAkhir:(e&&e.kontrakSelesai)||t,bayar:'bersama jadwal penggajian berikutnya',barang:'seragam, kartu identitas, dan alat kerja',batas:iso(new Date(Date.now()+7*864e5)),sertaKasbon:true,catatKeluar:true})}
  if(j==='pk'){f.keluar=(e&&e.tglKeluar)||t;f.alasan=(e&&e.alasanKeluar)==='Kontrak berakhir'?'kontrak':(e&&e.alasanKeluar)==='Mengundurkan diri'?'resign':'netral';f.apresiasi=true}
  if(j==='ol'){Object.assign(f,{nama:'',jabatan:'Operator CNC',dept:'Produksi',statusTxt:'Karyawan kontrak (PKWT) 1 (satu) tahun',gaji:0,lembur:+st.uangLembur||20000,jam:'Senin–Sabtu, 08.00–16.00',mulai:addMonthsISO(t,1),batas:iso(new Date(Date.now()+7*864e5))})}
  return f}

function srtPdf(j,f){

    doc.setTextColor(0);doc.setFont('times','bold');doc.setFontSize(14);doc.text(String(st.nama||'CV. SOPANDI TEKNO UTAMA').toUpperCase(),116,16,{align:'center'});
    doc.setFont('times','normal');doc.setFontSize(9);KOP_ALAMAT.forEach((s,i)=>doc.text(s,116,21.5+i*4,{align:'center'}));doc.setLineWidth(.5);doc.line(L-2,31,R,31)};
  const newPage=()=>{doc.addPage();head();y=TOP};head();

  const toks=t=>{const out=[];String(t).split('**').forEach((seg,i)=>seg.split(/(\s+)/).forEach(w=>{if(w&&!/^\s+$/.test(w))out.push({w,b:i%2===1});else if(w)out.push({sp:1})}));

    const r=[];out.forEach(o=>{if(o.sp){r.push(o);return}const p=r[r.length-1];if(p&&!p.sp&&r.length)p.parts.push(o);else r.push({parts:[o]})});return r.filter(o=>o.parts)};
  const wOf=p=>{doc.setFont(font,p.b?'bold':'normal');return doc.getTextWidth(p.w)};
  function para(text,x,w,opt){opt=opt||{};doc.setFontSize(opt.size||size);const words=toks(text);const sw=(doc.setFont(font,'normal'),doc.getTextWidth(' '));
    const lines=[];let cur=[],cw=0;words.forEach(o=>{o.width=o.parts.reduce((a,p)=>a+wOf(p),0);const add=(cur.length?sw:0)+o.width;if(cur.length&&cw+add>w){lines.push(cur);cur=[o];cw=o.width}else{cur.push(o);cw+=add}});if(cur.length)lines.push(cur);
    lines.forEach((ln,li)=>{ensure(lh);let xx=x;const tot=ln.reduce((a,o)=>a+o.width,0);const gap=(opt.just!==false&&li<lines.length-1&&ln.length>1)?(w-tot)/(ln.length-1):sw;

      ln.forEach(o=>{o.parts.forEach(p=>{doc.setFont(font,p.b?'bold':'normal');doc.text(p.w,xx,y);xx+=doc.getTextWidth(p.w)});xx+=gap});y+=lh});
    doc.setFont(font,'normal')}
  blocks.forEach((b,bi)=>{doc.setFontSize(size);doc.setFont(font,'normal');
    if(b.t==='gap'){y+=b.h;return}
    if(b.t==='title'){ensure(lh*2);doc.setFont(font,'bold');doc.setFontSize(size+1);doc.text(b.text,105,y,{align:'center'});const tw=doc.getTextWidth(b.text);doc.setLineWidth(.3);doc.line(105-tw/2,y+.8,105+tw/2,y+.8);y+=lh+1;return}
    if(b.t==='center'){doc.text(b.text,105,y,{align:'center'});y+=lh;return}
    if(b.t==='p'){para(b.text,L+(b.indent||0),W-(b.indent||0));y+=1.8;return}
    if(b.t==='lines'){b.lines.forEach(s=>para(s,L,W,{just:false}));y+=1;return}
    if(b.t==='kv'){const x0=L+(b.x||0)+(b.num?6:0),kw=b.kw||46;if(b.num){ensure(lh);doc.text(b.num,L,y)}
      b.rows.forEach(([k,v])=>{ensure(lh);doc.setFont(font,'normal');doc.text(k,x0,y);doc.text(':',x0+kw,y);para(v,x0+kw+3,R-(x0+kw+3),{just:false});y+=.6});y+=1.6;return}
    if(b.t==='pasal'){ensure(lh*5);y+=3;doc.setFont(font,'bold');doc.text('PASAL '+b.n,105,y,{align:'center'});y+=lh;doc.text(b.text,105,y,{align:'center'});y+=lh+1;return}
    if(b.t==='ayat'){ensure(lh*2);doc.setFont(font,'bold');doc.text('Ayat '+b.n,L,y);doc.setFont(font,'normal');para(b.text,L+15,W-15);
      (b.items||[]).forEach((it,i)=>{ensure(lh);doc.text((i+1)+'.',L+16,y);para(it,L+21,W-21)});y+=1.6;return}
    if(b.t==='sig'){ensure(52);y+=4;para(b.date,L,W,{just:false});y+=1;const cols=[[L,b.L],[R-62,b.R]];
      cols.forEach(([x,c])=>{if(!c)return;let yy=y;const cx=x+31;const hd=String(c.head);doc.setFont(font,hd.startsWith('**')?'bold':'normal');doc.text(hd.replace(/\*/g,''),cx,yy,{align:'center'});
        if(c.meterai){doc.setLineDashPattern([1,1],0);doc.setLineWidth(.2);doc.rect(x+2,yy+6,18,11);doc.setLineDashPattern([],0);doc.setFontSize(7);doc.setFont(font,'normal');doc.text('Meterai',x+11,yy+11,{align:'center'});doc.text('10.000',x+11,yy+14,{align:'center'});doc.setFontSize(size)}
        yy+=27;doc.setFont(font,'bold');const nm=cl(c.name);doc.text(nm,cx,yy,{align:'center'});const tw=doc.getTextWidth(nm);doc.setLineWidth(.25);doc.line(cx-tw/2,yy+.8,cx+tw/2,yy+.8);
        doc.setFont(font,'normal');doc.text(cl(c.title),cx,yy+lh,{align:'center'})});y+=27+lh*2;return}
  });
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('times','normal');doc.setFontSize(8);doc.setTextColor(90);doc.text(label,L,287);doc.text(i+' | Halaman',R,287,{align:'right'});doc.setTextColor(0)}
  return doc}

function identMissing(e){const m=[];if(!/^\d{16}$/.test(e.nik||''))m.push(e.nik?'NIK tidak 16 digit':'NIK');if(!e.alamat)m.push('alamat');if(!e.ktpUrl)m.push('foto KTP');return m}
function identPill(e){const m=identMissing(e);return m.length?'<span class="pill p-warn" title="Belum ada: '+esc(m.join(', '))+'">Kurang '+m.length+'</span>':'<span class="pill p-ok">Lengkap</span>'}
const NAMEMAP={MUHAMMAD:'M',MUHAMAD:'M',MOHAMMAD:'M',MOHAMAD:'M',MOCHAMAD:'M',MOCHAMMAD:'M',MUH:'M',MOH:'M'};
function nameToks(n){return String(n||'').toUpperCase().replace(/\([^)]*\)/g,' ').replace(/[^A-Z ]/g,' ').split(/\s+/).filter(Boolean).map(t=>NAMEMAP[t]||t)}
function nameScore(a,b){const A=nameToks(a),B=nameToks(b);if(!A.length||!B.length)return 0;const ja=A.join(''),jb=B.join('');if(ja===jb)return 1;
  const sb=new Set(B);let hit=A.filter(t=>sb.has(t)||[...sb].some(x=>(x.length>3&&t.length>3&&(x.startsWith(t)||t.startsWith(x)))||(x.length===1&&t[0]===x)||(t.length===1&&x[0]===t))).length;
  let sc=hit/Math.max(A.length,B.length);if(ja.length>5&&(jb.includes(ja)||ja.includes(jb)))sc=Math.max(sc,.8);return sc}
function waNorm(w){let d=String(w||'').replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);else if(d.startsWith('8'))d='62'+d;return d}
function colFind(heads,keys){return heads.find(h=>keys.some(k=>h.toUpperCase().includes(k)))}
// Satu baris form → dicocokkan ke karyawan aktif (rekening dulu, lalu nama).
function identEntry(r,i,emps){const accOf=e=>parseRek(e.rekening,'').acc;const rek=r.rek;const racc=(typeof rek==='number'?String(Math.round(rek)):String(rek||'').split('(')[0].replace(/\D/g,''));
  const o={i,ts:r.ts instanceof Date?r.ts.getTime():(+r.ts||0),nama:String(r.nama||'').trim(),jab:String(r.jab||'').trim(),nik:String(r.nik||'').replace(/\D/g,''),nikRaw:String(r.nik||'').trim(),rekRaw:String(rek||'').trim(),racc,ktp:String(r.ktp||'').trim(),wa:waNorm(r.wa),npwp:(/\d{6}/.test(String(r.npwp||''))?String(r.npwp).trim():''),alamat:String(r.alamat||'').replace(/\s+/g,' ').trim()};
  let m=racc.length>=8?emps.find(e=>accOf(e)===racc):null;o.how=m?'rekening':'';
  if(!m){let best=null,bs=0,second=0;emps.forEach(e=>{const sc=nameScore(o.nama,e.nama);if(sc>bs){second=bs;bs=sc;best=e}else if(sc>second)second=sc});if(best&&bs>=.5&&bs>second){m=best;o.how='nama'}}
  o.emp=m?m.id:'';o.nameOk=m?nameScore(o.nama,m.nama)>=.5:false;if(m&&!o.nameOk){o.sugg=m.id;o.emp=''}return o}

function identAdds(prev,x){const a={};const empty=v=>!String(v==null?'':v).trim();
  if(empty(prev.namaKtp)&&x.namaKtp)a.namaKtp=x.namaKtp;if(empty(prev.nik)&&x.nik)a.nik=x.nik;if(empty(prev.npwp)&&x.npwp)a.npwp=x.npwp;
  if(empty(prev.alamat)&&x.alamat)a.alamat=x.alamat;if(empty(prev.ktpUrl)&&x.ktpUrl)a.ktpUrl=x.ktpUrl;if(empty(prev.wa)&&x.wa)a.wa=x.wa;
  if(empty(prev.rekening)&&x.rekRaw)a.rekening=String(x.rekRaw).replace(/\.0$/,'').trim();return a}

async function impIdentGo(){

}

  const emps=payEmps(key);const hasData=locked||Object.values(per.absensi||{}).some(r=>Object.values(r).some(v=>v));
  const kos=locked?0:attChecks(key).filter(c=>/belum diisi/.test(c.s)).length;
  const jam=emps.reduce((n,e)=>n+otHours(e.id,key),0);
  const pc=locked?[]:payChecks(key).filter(c=>c.lvl!=='info'&&c.id);
  const sk=per.slipKirim||{};const nSlip=emps.filter(e=>sk[e.id]).length;
  const kd=S.kpiN[key]||{};const nKpi=emps.filter(e=>{const v=(kd.nilai||{})[e.id];return v&&Object.keys(v).length}).length;

// ===== Telat tanpa keterangan =====
// Menit telat dicatat per hari (periods/{key}.telat). Potongan = jam telat × tarif; tiap hari dihitung per jam yang dimulai
// (1–60 menit = 1 jam), telat sampai batas toleransi tidak dihitung. Karyawan bebas telat tidak dipotong.
function telatCfg(){const st=S.settings||{};const jm=/^(\d{1,2})[:.](\d{2})$/.exec(st.jamMasuk||'08:00');
  return {tarif:st.telatTarif!=null?+st.telatTarif:10000,tol:+st.telatToleransi||0,masuk:jm?(+jm[1])*60+(+jm[2]):480,masukTxt:st.jamMasuk||'08:00',bebasJab:(st.telatBebasJab!=null?st.telatBebasJab:['PROGRAMMER']).map(x=>normJab(x)).filter(Boolean)}}
function telatBebas(e){if(!e)return false;if(e.bebasTelat)return true;const j=normJab(e.jabatan||'');return telatCfg().bebasJab.some(b=>j.includes(b))}
function telatHitung(empId,key){const t=((S.periods[key]||{}).telat||{})[empId]||{};const {start,end}=periodRange(key);const f=iso(start),l=iso(end);const c=telatCfg();let jam=0,hari=0,menit=0;
  for(const d in t){const m=+t[d]||0;if(d<f||d>l||m<=c.tol)continue;hari++;menit+=m;jam+=Math.ceil(m/60)}return {jam,hari,menit}}
function vTelat(){
  const key=S.periodKey;const T=(P().telat)||{};const dates=periodDates(key);const hol=holidays();const c=telatCfg();
  const emps=periodEmps().filter(e=>!S.q||(e.nama+' '+e.id).toLowerCase().includes(S.q.toLowerCase()));let gj=0,gr=0;
  const head='<tr><th class="stick">Karyawan</th>'+dates.map(d=>{const dt=parse(d);return '<th class="'+(dt.getDay()===0?'sun':'')+(hol.has(d)?' hol':'')+'">'+dt.getDate()+'<span class="dw">'+DOW[dt.getDay()]+'</span></th>'}).join('')+'<th class="tot">Jam</th><th class="tot">Potongan</th></tr>';
  const body=emps.map(e=>{const r=T[e.id]||{};const h=telatHitung(e.id,key);const bb=telatBebas(e);const pot=bb?0:h.jam*c.tarif;gj+=bb?0:h.jam;gr+=pot;
    return '<tr><td class="stick"><div class="name" style="font-size:12.5px">'+esc(e.nama)+keluarPill(e)+'</div><div class="sub" style="font-size:11px">'+esc(e.id)+(bb?' · <span class="pill p-mute">Tidak dipotong</span>':'')+'</div></td>'+
    dates.map(d=>{const v=+r[d]||'';const dt=parse(d);return '<td class="lcell'+(dt.getDay()===0?' sun':'')+(hol.has(d)?' hol':'')+'"><input type="number" min="0" step="1" inputmode="numeric" placeholder=" " aria-label="Menit telat '+esc(e.nama)+' '+d+'" data-telat="'+esc(e.id)+'" data-d="'+d+'" value="'+v+'"'+(isLocked()?' disabled':'')+'></td>'}).join('')+
    '<td class="tot">'+(h.jam||'')+'</td><td class="tot" style="text-align:right">'+(pot?rp(pot):bb&&h.jam?'—':'')+'</td></tr>'}).join('');
  return topbar('Telat tanpa keterangan',true,isLocked()?'':'<button class="btn" data-act="mesinOpen">Isi dari mesin absen</button>')+lockBanner()+
  '<div class="row"><input id="q" class="search" type="search" placeholder="Cari karyawan…" value="'+esc(S.q)+'"><span class="sub">Total periode: <b>'+gj+' jam = Rp '+rp(gr)+'</b></span></div>'+
  '<p class="note" style="margin:0">Ketik <b>menit</b> telat di tanggalnya. Potongan Rp '+rp(c.tarif)+' per jam, dihitung per jam yang dimulai (1–60 menit = 1 jam, 61–120 menit = 2 jam)'+(c.tol?'; telat sampai '+c.tol+' menit tidak dihitung':'')+'. Jam masuk '+esc(c.masukTxt)+'. Telat dengan keterangan cukup dikosongkan. Karyawan bertanda “Tidak dipotong” tetap boleh dicatat tetapi tidak dipotong. Aturan diubah di Pengaturan.</p>'+
  '<div class="tablewrap" style="max-height:70vh"><table class="att"><thead>'+head+'</thead><tbody>'+(body||'<tr><td class="empty" colspan="40">Belum ada karyawan.</td></tr>')+'</tbody></table></div>'}
// telat menurut scan mesin: hari tercatat H, scan pertama sebelum 12.00 dan melewati jam masuk + toleransi
function mesinTelat(D){const M=S.mesin;const c=telatCfg();const A=(S.periods[D.key]||{}).absensi||{};const TL=(S.periods[D.key]||{}).telat||{};const out=[];const hol=holidays();
  const e2m={};for(const mid in M.map)if(M.map[mid].id)e2m[M.map[mid].id]=mid;
  periodEmps(D.key).forEach(e=>{const mid=e2m[e.id];if(!mid||telatBebas(e))return;const pr=M.pres[mid]||{};
    D.dates.forEach(d=>{const sc=pr[d];if(!sc||(A[e.id]||{})[d]!=='H'||parse(d).getDay()===0||hol.has(d))return;const late=sc.first-c.masuk;

  logAct('absen','Mencatat telat dari mesin absen',{ket:rows.length+' hari · periode '+periodLabel(D.key)+' · file '+M.file});

// Scan sebelum pukul 04.00 dihitung milik hari sebelumnya (pulang lembur lewat tengah malam).
const MESIN_SHIFT=240;

  const s=String(v==null?'':v).trim();let m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);m=/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/.exec(s);return m?m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]):''}
function xlsMinutes(v){if(typeof v==='number')return Math.round((v-Math.floor(v))*1440)%1440;if(v instanceof Date)return v.getHours()*60+v.getMinutes();const m=/(\d{1,2})[:.](\d{2})/.exec(String(v||''));return m?(+m[1])*60+(+m[2]):null}

function mesinParse(wb){
  const people={},pres={};let from='',to='';
  const add=(id,nama,date,min)=>{if(!date||min==null||id==null||id==='')return;id=String(id).trim();if(!people[id])people[id]={id,nama:String(nama||'').trim()};
    if(!from||date<from)from=date;if(!to||date>to)to=date;
    let d=date,m=min;if(min<MESIN_SHIFT){const x=parse(date);x.setDate(x.getDate()-1);d=iso(x);m=min+1440}
    const p=(pres[id]=pres[id]||{})[d]||(pres[id][d]={first:m,last:m,n:0});p.first=Math.min(p.first,m);p.last=Math.max(p.last,m);p.n++};
  const sheets=wb.SheetNames.map(n=>({n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})}));
  const find=(need)=>{for(const sh of sheets){for(let i=0;i<Math.min(sh.rows.length,10);i++){const h=sh.rows[i].map(x=>String(x).trim().toLowerCase());if(need.every(k=>h.some(c=>c===k||c.startsWith(k))))return {sh,i,h}}}return null};
  const col=(h,k)=>h.findIndex(c=>c===k||c.startsWith(k));
  let f=find(['id','nama','tanggal','jam']);
  if(f){const {sh,i,h}=f;const ci=col(h,'id'),cn=col(h,'nama'),ct=col(h,'tanggal'),cj=col(h,'jam');sh.rows.slice(i+1).forEach(r=>add(r[ci],r[cn],xlsDate(r[ct]),xlsMinutes(r[cj])));return {people,pres,from,to,sumber:sh.n}}
  f=find(['id','nama','tanggal','semua scan']);
  if(f){const {sh,i,h}=f;const ci=col(h,'id'),cn=col(h,'nama'),ct=col(h,'tanggal'),cs=col(h,'semua scan');
    sh.rows.slice(i+1).forEach(r=>{const d=xlsDate(r[ct]);String(r[cs]||'').split(',').forEach(x=>add(r[ci],r[cn],d,xlsMinutes(x)))});return {people,pres,from,to,sumber:sh.n}}

// Nama di mesin biasanya pendek ("FAHMI", "EGA B", "teguh firmansya"). Skor = bagian nama mesin yang cocok dengan nama di website:
// kata utuh atau terpotong (min. 4 huruf) bernilai 1, inisial bernilai 0,5 dan hanya dihitung bila ada kata yang cocok.
function mesinScore(m,w){const A=nameToks(m),B=nameToks(w);if(!A.length||!B.length)return 0;let strong=0,ini=0;const used=new Set();
  A.forEach(t=>{const i=B.findIndex((x,k)=>!used.has(k)&&(x===t||(t.length>=4&&x.length>=4&&(x.startsWith(t)||t.startsWith(x)))));if(i>=0&&t.length>=2){used.add(i);strong++;return}
    if(t.length===1){const j=B.findIndex((x,k)=>!used.has(k)&&x[0]===t);if(j>=0){used.add(j);ini++}}});
  if(!strong)return 0;return (strong+ini*0.5)/A.length+0.01*(strong+ini)/B.length}
function mesinMatch(people){
  const emps=empList(true);const out={};
  for(const mid in people){const saved=emps.find(e=>String(e.idMesin||'')===mid);if(saved){out[mid]={id:saved.id,sc:1,src:'tersimpan'};continue}
    let best=null,bs=0,second=0;emps.forEach(e=>{const sc=Math.max(mesinScore(people[mid].nama,e.nama),e.namaKtp?mesinScore(people[mid].nama,e.namaKtp):0);if(sc>bs){second=bs;bs=sc;best=e}else if(sc>second)second=sc});
    out[mid]=bs>=0.5&&bs-second>0.001?{id:best.id,sc:bs,src:'nama'}:{id:'',sc:bs,src:''}}
  // satu karyawan hanya boleh dipasangkan ke satu ID mesin: yang skornya tertinggi
  const by={};for(const mid in out){const o=out[mid];if(!o.id)continue;if(!by[o.id]||out[by[o.id]].sc<o.sc){if(by[o.id])out[by[o.id]]={id:'',sc:out[by[o.id]].sc,src:''};by[o.id]=mid}else out[mid]={id:'',sc:o.sc,src:''}}
  return out}
function mesinKey(M){const c={};for(let d=parse(M.from);iso(d)<=M.to;d.setDate(d.getDate()+1)){const k=keyFor(d);c[k]=(c[k]||0)+1}return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]}
function mesinDiff(){
  const M=S.mesin;const key=M.key;const A=(S.periods[key]||{}).absensi||{};const {start,end}=periodRange(key);const s0=iso(start),s1=iso(end);const t=todayISO();
  const lo=M.from>s0?M.from:s0;let hi=M.to<s1?M.to:s1;if(hi>t)hi=t;const dates=[];for(let d=parse(lo);iso(d)<=hi;d.setDate(d.getDate()+1))dates.push(iso(d));
  const hol=holidays();const e2m={};for(const mid in M.map)if(M.map[mid].id)e2m[M.map[mid].id]=mid;

  const noScan=[],rows=[];
  periodEmps(key).forEach(e=>{const mid=e2m[e.id];const pr=mid?(M.pres[mid]||{}):{};

const ALASAN_KELUAR=['Mengundurkan diri','Kontrak berakhir','PHK','Meninggal dunia','Lainnya'];
function masaKerja(a,b){const d1=parse(a),d2=parse(b||todayISO());if(!d1||!d2||d2<d1)return '—';let m=(d2.getFullYear()-d1.getFullYear())*12+d2.getMonth()-d1.getMonth();if(d2.getDate()<d1.getDate())m--;const y=Math.floor(m/12);m=m%12;return (y?y+' tahun ':'')+(m||!y?m+' bulan':'').trim()}
function kasbonSisa(id){let t=0;for(const k in S.loans){const l=S.loans[k];if(l.empId===id)t+=Math.max(0,(+l.jumlah||0)-loanPaidBefore(l,''))}return t}
function empHistory(id){const why=[];
  for(const k in S.periods){const p=S.periods[k];if(['absensi','lembur'].some(s=>Object.values((p[s]||{})[id]||{}).some(v=>v&&String(v)!=='0'))||+((p.reimburse||{})[id])||+((p.bonus||{})[id])||+((p.potonganLain||{})[id])||(p.kunci&&p.kunci.rows&&p.kunci.rows[id])){why.push('absensi/payroll');break}}
  if(Object.values(S.loans).some(l=>l.empId===id))why.push('kasbon');if(Object.values(S.warns).some(w=>w.empId===id))why.push('surat peringatan');
  if(Object.values(S.surat||{}).some(r=>r.empId===id))why.push('surat');if(Object.values(S.kpiN||{}).some(d=>(d.nilai||{})[id]))why.push('KPI');return why}
function exitSummary(e,tgl){
  if(!tgl)return '<p class="sub">Isi tanggal keluar dulu.</p>';const key=keyFor(parse(tgl));const sisaKas=kasbonSisa(e.id);const potKas=kasbonFor(e.id,key);
  let after=0;for(const k in S.periods){const r=((S.periods[k].absensi||{})[e.id])||{};for(const d in r)if(r[d]&&d>tgl)after++}
  const sp=activeWarns(e.id);const li=[];

  li.push(['Sisa cuti',cutiSisa(e,cutiYearOf(tgl))+' hari (tahun cuti '+cutiYearOf(tgl)+'/'+String(cutiYearOf(tgl)+1).slice(2)+')']);
  li.push(['Kasbon',sisaKas?'Sisa <b>Rp '+rp(sisaKas)+'</b>. Dipotong di payroll terakhir Rp '+rp(potKas)+(sisaKas-potKas>0?'; sisa <b>Rp '+rp(sisaKas-potKas)+'</b> perlu diselesaikan langsung.':'.'):'Tidak ada']);
  if(sp.length)li.push(['Surat peringatan',esc(sp.map(w=>w.tingkat+' s/d '+fmtD(w.sampai)).join(', '))]);
  if(after)li.push(['Perlu dicek','<span style="color:var(--bad)">'+after+' hari absensi tercatat setelah tanggal keluar.</span> Hapus di halaman Absensi supaya tidak ikut dibayar.']);
  li.push(['Masa kerja',esc(masaKerja(e.tglBergabung,tgl))]);
  return '<dl class="kv xsum">'+li.map(([k,v])=>'<dt>'+k+'</dt><dd>'+v+'</dd>').join('')+'</dl>'}

function empTab(k){S.empTab=k;document.querySelectorAll('#modalRoot [data-sec]').forEach(d=>d.hidden=d.dataset.sec!==k);document.querySelectorAll('#modalRoot .ftabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.id===k))}
function empCheck(){
  if(!$('#f_gajiPokok'))return {err:[],warn:[]};const v=id=>$('#f_'+id).value.trim();const err=[],warn=[];const msg={};
  const put=(lvl,sec,id,m)=>{(lvl==='err'?err:warn).push({sec,id,m});if(!msg[id])msg[id]={lvl,m}};
  const gp=+digits(v('gajiPokok'))||0,pb=+v('pembagi')||24,ks=v('kontrakSelesai'),km=v('kontrakMulai'),tb=v('tglBergabung'),nik=digits(v('nik')),id=v('id').toUpperCase();
  if(!v('nama'))put('err','kerja','nama','Nama wajib diisi');
  else if(S.empNew&&Object.values(S.emps).some(x=>x.nama===v('nama').toUpperCase()&&x.id!==id))put('warn','kerja','nama','Sudah ada karyawan dengan nama ini. Pastikan bukan data ganda');
  if(ks&&km&&ks<km)put('err','kerja','kontrakSelesai','Kontrak berakhir sebelum tanggal mulainya');
  else if(ks&&tb&&ks<tb)put('err','kerja','kontrakSelesai','Kontrak berakhir sebelum tanggal bergabung');
  if(!$('#f_aktif').checked&&v('tglKeluar')&&tb&&v('tglKeluar')<tb)put('err','kerja','tglKeluar','Tanggal keluar sebelum tanggal bergabung');
  if(!gp)put('warn','gaji','gajiPokok','Gaji pokok masih 0');
  else if(gp<500000)put('warn','gaji','gajiPokok','Di bawah Rp 500.000. Kurang angka nol?');
  else if(gp>50000000)put('warn','gaji','gajiPokok','Di atas Rp 50.000.000. Kelebihan angka nol?');
  if(pb<20||pb>31)put('warn','gaji','pembagi','Biasanya 24 atau 26');
  if($('#f_lemburMode').value==='khusus'&&!(+digits(v('lemburTarif'))))put('warn','gaji','lemburTarif','Nominal khusus dipilih tetapi belum diisi');
  if(!v('rekening'))put('warn','gaji','rekening','Rekening kosong. Gaji tidak bisa ditransfer');
  if(nik&&nik.length!==16)put('warn','ident','nik','NIK harus 16 angka, sekarang '+nik.length);
  if(v('email')&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('email')))put('warn','ident','email','Format email belum benar');
  document.querySelectorAll('#modalRoot .ferr').forEach(s=>{const k=s.id.slice(3);const m=msg[k];s.textContent=m?m.m:'';s.className='ferr'+(m&&m.lvl==='warn'?' w':'');const inp=$('#f_'+k);if(inp)inp.classList.toggle('bad',!!m&&m.lvl==='err')});
  document.querySelectorAll('#modalRoot .ftabs button').forEach(b=>{const k=b.dataset.id;const d=b.querySelector('.fdot');const e1=err.some(x=>x.sec===k),w1=warn.some(x=>x.sec===k);d.hidden=!(e1||w1);d.className='fdot'+(e1?'':' w')});
  const hr=gp/pb;$('#fcalc').innerHTML='<span>Gaji per hari: <b>Rp '+rp(hr)+'</b></span><span>Lembur Minggu per hari: <b>Rp '+rp(Math.round(hr)*2)+'</b></span>';
  $('#fsum').textContent=err.length?err.length+' isian harus diperbaiki':warn.length?warn.length+' peringatan':'';
  if(S.empWarnOk){S.empWarnOk=false;const b=$('#empSaveBtn');if(b)b.textContent='Simpan'}
  return {err,warn}}

function attDay(){const ds=periodDates(S.periodKey);const t=todayISO();if(S.attDay&&ds.includes(S.attDay))return S.attDay;return S.attDay=ds.includes(t)?t:(t>ds[ds.length-1]?ds[ds.length-1]:ds[0])}
function attProg(d){const A=P().absensi||{};const emps=periodEmps();const n=emps.filter(e=>(A[e.id]||{})[d]).length;return {n,tot:emps.length}}

function attSetVal(e,d,v,quiet){const cur=((P().absensi||{})[e]||{})[d]||'';if(cur===v)return cur;patchPeriod({absensi:{[e]:{[d]:v}}});if(cur&&!quiet)logAct('absen','Mengubah absensi · '+enm(e)+', '+fmtD(d),{dari:cur,ke:v||'(kosong)'});return cur}
function attRefresh(){const d=attDay();const A=P().absensi||{};document.querySelectorAll('.attday .segb').forEach(b=>b.setAttribute('aria-pressed',((A[b.dataset.e]||{})[d]||'')===b.dataset.c));const pg=attProg(d);const bar=$('#attBar'),tx=$('#attTxt');if(bar)bar.style.width=(pg.tot?Math.round(pg.n/pg.tot*100):0)+'%';if(tx)tx.textContent=pg.n+' dari '+pg.tot+' sudah diisi'}

const REM_LIST=[['kontrak','Kontrak akan berakhir','Karyawan kontrak yang masa kontraknya hampir habis atau sudah lewat',30],['sp','Surat peringatan akan berakhir','SP yang masa berlakunya hampir selesai',14],['payroll','Payroll belum dikunci','Periode sudah ditutup tetapi payroll belum dikunci',0],['absen','Absensi belum lengkap','Hari kerja yang belum diisi di periode berjalan',0],['pkl','PKL akan selesai','Siswa PKL yang masa magangnya hampir habis',14],['cadangan','Cadangan data sudah lama','Cadangan terakhir lebih dari 30 hari lalu',0]];
const REM_JADWAL=[['senin','Setiap Senin'],['harian','Setiap hari kerja'],['1-15','Tanggal 1 dan 15']];
function remCfg(src){const c=src||(S.settings||{}).pengingat||{};const on={},hari={};REM_LIST.forEach(([k,,,h])=>{on[k]=c.on&&c.on[k]!=null?!!c.on[k]:k!=='pkl';if(h)hari[k]=(c.hari&&+c.hari[k])||h});return {to:(c.to||[]).slice(),jadwal:c.jadwal||'senin',on,hari,last:c.last||''}}
function remSections(c){
  const t=todayISO();const out=[];const add=(k,items)=>{if(c.on[k]&&items.length)out.push({judul:REM_LIST.find(r=>r[0]===k)[1],items})};const lagi=d=>d<0?'sudah lewat '+(-d)+' hari':d===0?'hari ini':d+' hari lagi';
  add('kontrak',empList().filter(e=>e.kontrakSelesai&&daysBetween(t,e.kontrakSelesai)<=c.hari.kontrak).sort((a,b)=>a.kontrakSelesai.localeCompare(b.kontrakSelesai)).map(e=>e.nama+' · kontrak berakhir '+fmtD(e.kontrakSelesai)+' ('+lagi(daysBetween(t,e.kontrakSelesai))+')'));
  add('sp',Object.values(S.warns).filter(w=>{const st=warnStatus(w,t);return ['on','soon'].includes(st.k)&&st.d<=c.hari.sp}).map(w=>enm(w.empId)+' · '+w.tingkat+' berakhir '+fmtD(w.sampai)+' ('+lagi(daysBetween(t,w.sampai))+')'));
  {const pk=shiftKey(keyFor(new Date()),-1);const pp=S.periods[pk];if(pp&&Object.keys(pp.absensi||{}).length&&!isLocked(pk))add('payroll',['Payroll '+periodLabel(pk)+' belum dikunci (periode ditutup '+fmtD(iso(periodRange(pk).end))+')'])}
  {const ck=keyFor(new Date());const n=attChecks(ck).filter(x=>/belum diisi/.test(x.s)).length;if(n)add('absen',[n+' karyawan punya hari kerja kosong di periode '+periodLabel(ck)])}
  add('pkl',Object.values(S.interns).filter(p=>p.selesai&&daysBetween(t,p.selesai)>=0&&daysBetween(t,p.selesai)<=c.hari.pkl).map(p=>p.nama+' · selesai '+fmtD(p.selesai)+' ('+lagi(daysBetween(t,p.selesai))+')'));
  {const lb=(S.settings||{}).lastBackup;const d=lb?daysBetween(lb.slice(0,10),t):null;if(d==null||d>30)add('cadangan',[d==null?'Data belum pernah dicadangkan':'Cadangan terakhir '+fmtD(lb.slice(0,10))+' ('+d+' hari lalu)'])}
  return out}
function remSlot(c,t){const d=parse(t);let s=new Date(d);if(c.jadwal==='harian'){if(s.getDay()===0)s.setDate(s.getDate()-1)}else if(c.jadwal==='1-15')s=new Date(d.getFullYear(),d.getMonth(),d.getDate()>=15?15:1);else s.setDate(s.getDate()-((s.getDay()+6)%7));return iso(s)}
function remRead(){const c=remCfg();if(!$('#rem_to'))return c;c.to=$('#rem_to').value.split(/[\s,;]+/).map(x=>x.trim().toLowerCase()).filter(Boolean);c.jadwal=$('#rem_jadwal').value;REM_LIST.forEach(([k,,,h])=>{c.on[k]=$('#rem_on_'+k).checked;if(h)c.hari[k]=+$('#rem_h_'+k).value||h});return c}
function remPreview(c){const sec=remSections(c);const n=sec.reduce((a,s)=>a+s.items.length,0);const bad=c.to.filter(x=>!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x));
  return '<div class="mailhd"><span>Kepada</span><b>'+(c.to.length?esc(c.to.join(', ')):'(belum ada penerima)')+'</b><span>Judul</span><b>'+(n?'Pengingat HRD: '+n+' hal perlu perhatian':'(tidak ada email dikirim)')+'</b></div>'+
  '<div class="mailbd">'+(bad.length?'<div class="pill p-bad" style="align-self:flex-start;white-space:normal">Alamat belum benar: '+esc(bad.join(', '))+'</div>':'')+(n?'<p style="margin:0">Berikut hal yang perlu ditindaklanjuti per '+esc(HARI[parse(todayISO()).getDay()]+', '+fmtD(todayISO()))+'.</p>'+sec.map(s=>'<div><b>'+esc(s.judul)+'</b><ul>'+s.items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>').join(''):'<p class="sub" style="margin:0">Saat ini tidak ada yang perlu diingatkan, jadi email tidak dikirim.</p>')+'</div>'}
function remPanel(){const c=remCfg();
  return '<div class="panel"><h2>Pengingat email<small>'+(c.last?'terakhir dikirim '+esc(fmtD(c.last)):'belum pernah dikirim')+'</small></h2><p class="note">Satu email ringkasan berisi hal yang mendekati tenggat, dikirim pada hari kirim sekitar pukul 07.00 WIB. Pengiriman memakai akun Gmail yang sama dengan kirim slip.</p>'+
  (()=>{const sc=((S.settings||{}).pengingat||{}).serverCek;return remServerOn()?'<div class="pill p-ok" style="align-self:flex-start">Otomatis dari server aktif · terakhir memeriksa '+esc(fmtD(iso(new Date(sc)))+' '+pad(new Date(sc).getHours())+'.'+pad(new Date(sc).getMinutes()))+'</div>':
   '<details class="srvset"><summary><span class="pill p-warn">Pengiriman otomatis server belum aktif</span> <span class="sub">Sementara email dikirim saat aplikasi dibuka. Klik untuk cara mengaktifkan.</span></summary><ol>'+
   '<li>Firebase → ikon gerigi → <b>Project settings → Service accounts</b> → <b>Generate new private key</b>. Sebuah file JSON terunduh. Simpan baik-baik, jangan dikirim ke siapa pun.</li>'+
   '<li>Vercel → project → <b>Settings → Environment Variables</b>: tambah <code>FIREBASE_SERVICE_ACCOUNT</code> berisi seluruh isi file JSON tadi, lalu <code>CRON_SECRET</code> berisi teks acak minimal 16 huruf/angka (buat sendiri). Opsional: <code>APP_URL</code> = alamat situs ini.</li>'+
   '<li>Vercel → <b>Deployments</b> → titik tiga di deployment teratas → <b>Redeploy</b>.</li>'+
   '<li>Besok pagi, halaman ini akan menampilkan “Otomatis dari server aktif”. Di Vercel → <b>Settings → Cron Jobs</b> juga ada tombol <b>Run</b> untuk mencoba sekarang.</li></ol></details>'})()+
  '<div class="split2"><div style="display:flex;flex-direction:column;gap:12px;min-width:0"><div class="form">'+
   '<label class="full">Dikirim ke<input id="rem_to" type="text" inputmode="email" autocomplete="off" placeholder="hrd@contoh.co.id, pimpinan@contoh.co.id" value="'+esc(c.to.join(', '))+'"><span class="hint">Pisahkan dengan koma. Paling banyak 10 alamat.</span></label>'+
   '<label>Hari kirim<select id="rem_jadwal">'+REM_JADWAL.map(([k,l])=>'<option value="'+k+'"'+(c.jadwal===k?' selected':'')+'>'+l+'</option>').join('')+'</select></label></div>'+
   '<div class="remlist">'+REM_LIST.map(([k,t,d,h])=>'<div class="remrow"><input class="tg" type="checkbox" id="rem_on_'+k+'"'+(c.on[k]?' checked':'')+' aria-label="'+esc(t)+'"><div class="t"><div class="name">'+esc(t)+'</div><div class="sub">'+esc(d)+'</div></div>'+(h?'<select id="rem_h_'+k+'" aria-label="Berapa hari sebelumnya">'+[7,14,30,60].map(n=>'<option value="'+n+'"'+(c.hari[k]===n?' selected':'')+'>'+n+' hari sebelum</option>').join('')+'</select>':'')+'</div>').join('')+'</div>'+
   '<div class="row"><button class="btn primary" data-act="remSave">Simpan pengingat</button><button class="btn" data-act="remSend">Kirim sekarang</button></div></div>'+
  '<div class="mailbox" id="remPrev">'+remPreview(c)+'</div></div></div>'}
async function remSave(){const c=remRead();const bad=c.to.filter(x=>!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x));if(bad.length){toast('Alamat email belum benar: '+bad[0]);return false}if(c.to.length>10){toast('Paling banyak 10 alamat.');return false}
  const p={to:c.to,jadwal:c.jadwal,on:c.on,hari:c.hari,last:c.last};setSaving(1);try{await S.db.doc('settings/company').update({pengingat:p});S.settings.pengingat=p;logAct('data','Mengubah pengaturan pengingat email',{ket:c.to.length+' penerima · '+(REM_JADWAL.find(j=>j[0]===c.jadwal)||[])[1]});toast('Pengingat disimpan.');return true}catch(e){handleErr(e);return false}finally{setSaving(-1)}}
async function remPost(c,sec){
  if(!S.getToken)return {ok:false,err:'Kirim email tidak tersedia di tampilan ini.'};
  try{const token=await S.getToken();const r=await fetch('/api/kirim-pengingat',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({to:c.to,perusahaan:(S.settings||{}).nama,tanggal:HARI[parse(todayISO()).getDay()]+', '+fmtD(todayISO()),sections:sec,url:location.origin})});
    const j=await r.json().catch(()=>({}));return r.ok?{ok:true}:{ok:false,err:j.error||('HTTP '+r.status)}}catch(e){return {ok:false,err:'koneksi gagal'}}}
async function remMark(c,t){const p={to:c.to,jadwal:c.jadwal,on:c.on,hari:c.hari,last:t};try{await S.db.doc('settings/company').update({pengingat:{last:t}});S.settings.pengingat=Object.assign({},(S.settings||{}).pengingat,p)}catch(e){console.error(e)}}
async function remSend(){if(!(await remSave()))return;const c=remCfg();if(!c.to.length){toast('Isi alamat penerima dulu.');return}const sec=remSections(c);if(!sec.length){toast('Tidak ada yang perlu diingatkan saat ini.');return}
  toast('Mengirim pengingat…');const r=await remPost(c,sec);if(r.ok){await remMark(c,todayISO());logAct('akses','Mengirim email pengingat',{ket:'Ke '+c.to.join(', ')});toast('Pengingat terkirim ke '+c.to.length+' alamat.');render(true)}else toast('Gagal mengirim: '+r.err)}
function remServerOn(){const sc=((S.settings||{}).pengingat||{}).serverCek;return !!sc&&(Date.now()-new Date(sc).getTime())<50*3600e3}
async function remAuto(){
  if(remAuto.run||S.readonly||!S.getToken)return;if(!['settings','emps','warns','periods','interns'].every(k=>S.ready[k]))return;remAuto.run=true;
  const c=remCfg();if(!c.to.length||remServerOn())return;const t=todayISO();const slot=remSlot(c,t);if(c.last>=slot)return;const sec=remSections(c);if(!sec.length)return;
  const r=await remPost(c,sec);if(r.ok){await remMark(c,t);logAct('akses','Mengirim email pengingat (otomatis)',{ket:'Ke '+c.to.join(', ')});toast('Email pengingat terkirim ke '+c.to.length+' alamat.')}else console.error('pengingat gagal:',r.err)}

function repData(key){
  const emps=payEmps(key);const T={base:0,lm:0,ltm:0,lj:0,reimb:0,bonus:0,potSH:0,potAbsen:0,potTelat:0,kas:0,pot:0,thp:0,jam:0};const C={H:0,SH:0,I:0,S:0,C:0,A:0,LM:0,LTM:0};
  const jab={},st={};
  emps.forEach(e=>{const r=calc(e,key);for(const k in T)T[k]+=(+r[k]||0);for(const k in C)C[k]+=(r.c&&r.c[k])||0;
    const j=(e.jabatan||'—').toUpperCase();(jab[j]=jab[j]||{n:0,thp:0});jab[j].n++;jab[j].thp+=r.thp;st[e.status||'—']=(st[e.status||'—']||0)+1});
  const prevKey=shiftKey(key,-1);let prev=null;{const pp=S.periods[prevKey]||{};const hasData=isLocked(prevKey)||Object.values(pp.absensi||{}).some(r=>Object.values(r).some(v=>v));const pe=hasData?payEmps(prevKey):[];if(pe.length){let t=0;pe.forEach(e=>t+=calc(e,prevKey).thp);prev={n:pe.length,thp:t}}}
  const {start,end}=periodRange(key);const f=iso(start),t2=iso(end),today=todayISO();
  const masuk=empList(true).filter(e=>e.tglBergabung&&e.tglBergabung>=f&&e.tglBergabung<=t2);
  const keluar=empList(true).filter(e=>e.tglKeluar&&e.tglKeluar>=f&&e.tglKeluar<=t2);
  const sp=Object.values(S.warns).filter(w=>['on','soon'].includes(warnStatus(w,t2<today?t2:today).k)||(w.tanggal>=f&&w.tanggal<=t2));
  const kontrak=empList().filter(e=>e.kontrakSelesai&&daysBetween(t2,e.kontrakSelesai)>=0&&daysBetween(t2,e.kontrakSelesai)<=60).sort((a,b)=>a.kontrakSelesai.localeCompare(b.kontrakSelesai));
  let sisaKas=0,nKas=0;for(const id in S.loans){const l=S.loans[id];const s=(+l.jumlah||0)-loanPaidBefore(l,'');if(s>0){sisaKas+=s;nKas++}}
  const jabList=Object.entries(jab).sort((a,b)=>jabRank(a[0])-jabRank(b[0])||a[0].localeCompare(b[0]));
  return {emps,T,C,jabList,st,prev,masuk,keluar,sp,kontrak,sisaKas,nKas,f,t2}}

   '<div class="li"><div class="t"><div class="name">Karyawan masuk periode ini</div><div class="sub">'+names(D.masuk)+'</div></div></div>'+

   '<div class="li"><div class="t"><div class="name">Kontrak berakhir dalam 60 hari</div><div class="sub">'+(D.kontrak.length?D.kontrak.map(e=>esc(e.nama+' ('+fmtD(e.kontrakSelesai)+')')).join(', '):'—')+'</div></div></div>'+

async function repXlsx(){
  if(!window.XLSX){toast('Pustaka Excel belum termuat. Coba lagi sebentar.');return}
